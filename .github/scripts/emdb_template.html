<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EMDB Recent Releases</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background-color: #f8f9fa;
      color: #333;
    }

    header {
      background: #1e293b;
      color: white;
      padding: 24px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px 0;
      font-size: 1.8rem;
    }

    .timestamp {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .thumbnail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .img-container {
      width: 100%;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      border-radius: 4px;
      overflow: hidden;
    }

    .img-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .entry-id {
      font-weight: bold;
      color: #2563eb;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    .entry-title {
      font-size: 0.85rem;
      margin-top: 6px;
      flex-grow: 1;
      line-height: 1.3;
    }

    .entry-title a {
      color: #1e293b;
      text-decoration: none;
    }

    .entry-title a:hover {
      text-decoration: underline;
    }

    .entry-status {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 8px;
    }

    .badge {
      background: #e2e8f0;
      color: #334155;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    /* Modal Container Overlay */
    #modal {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.85);
      justify-content: center;
      align-items: center;
      padding: 16px;
      box-sizing: border-box;
    }

    .modal-body {
      background: white;
      border-radius: 12px;
      padding: 20px 24px 24px;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    /* Centered Control Cluster: < × > */
    .modal-nav-header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }

    .modal-nav-header button {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      color: #334155;
      transition: all 0.15s ease;
      line-height: 1;
    }

    .modal-nav-header button:hover {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    .close-btn {
      font-size: 1.5rem !important;
      font-weight: bold;
    }

    .modal-images {
      display: flex;
      justify-content: center;
    }

    .img-box {
      text-align: center;
      width: 100%;
    }

    .img-box h4 {
      margin: 0 0 8px 0;
      color: #64748b;
      font-size: 0.85rem;
    }

    .img-box img {
      max-width: 100%;
      height: 240px;
      object-fit: contain;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
    }

    .modal-details {
      margin-top: 20px;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 6px;
      color: #1e293b;
    }

    .modal-meta {
      font-size: 0.9rem;
      color: #475569;
      margin-top: 10px;
    }

    .modal-links {
      margin-top: 16px;
      display: flex;
      gap: 10px;
    }

    .btn {
      display: inline-block;
      padding: 8px 16px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .btn-secondary {
      background: #475569;
    }

    .btn-secondary:hover {
      background: #334155;
    }

    #modalIndex {
      text-align: center;
      color: #94a3b8;
      font-size: 0.8rem;
      margin-top: 16px;
    }

    /* Mobile Responsive Tweaks */
    @media (max-width: 600px) {
      #modal {
        padding: 8px;
      }

      .modal-body {
        padding: 14px;
        max-width: 96vw;
      }

      .modal-nav-header button {
        width: 36px;
        height: 36px;
        font-size: 1rem;
      }

      .img-box img {
        height: 180px;
      }
    }

    footer {
      text-align: center;
      padding: 24px;
      font-size: 0.85rem;
      color: #64748b;
    }

    footer a {
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>
<body>

<header>
  <h1>EMDB Recent Releases</h1>
  <div class="timestamp">Last Updated: {{TIMESTAMP}}</div>
</header>

<div class="thumbnail-grid">
  {{THUMBNAILS}}
</div>

{{MODAL_JS}}

<footer>
  Data sourced from <a href="https://www.ebi.ac.uk/emdb/" target="_blank">EMDB</a> and <a href="https://pdbj.org/emnavi/" target="_blank">PDBj EMNavi</a>.
</footer>

</body>
</html>
